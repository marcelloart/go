<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff7fb" />
  <meta name="description" content="Pilih nomor 1, 2, atau 3." />
  <title>Keira Daily — Pilih Favoritmu</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RJD6HYMCJV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RJD6HYMCJV');
    gtag('event', 'landing_view', {
      page_location: window.location.href,
      page_referrer: document.referrer || '(direct)'
    });
  </script>

  <style>
    :root{--bg:#fff7fb;--ink:#241923;--muted:#8d7c85;--pink:#ff4d98;--pink2:#ff8ebc;--line:#f1dbe5;--shadow:0 18px 50px rgba(101,47,72,.13)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{overflow-x:hidden;background:radial-gradient(circle at 10% 0%,rgba(255,90,154,.16),transparent 34%),radial-gradient(circle at 95% 10%,rgba(169,126,255,.14),transparent 30%),linear-gradient(180deg,#fffafd,#fff5f9)}
    .wrap{width:min(100%,440px);min-height:100vh;margin:0 auto;padding:18px 14px 28px;display:flex;flex-direction:column;justify-content:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:16px}
    .avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);box-shadow:0 10px 26px rgba(112,61,84,.08);font-size:21px}
    .handle{font-size:12px;font-weight:900;color:#66535d}
    .hero{text-align:center;margin-bottom:18px}
    .hero h1{margin:0;font-size:34px;line-height:1.02;letter-spacing:-1.2px}
    .hero p{margin:9px auto 0;max-width:320px;color:var(--muted);font-size:13px;line-height:1.45}
    .looks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .look{position:relative;overflow:hidden;min-height:190px;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;padding:0}
    .look:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.72)),radial-gradient(circle at 50% 15%,rgba(255,91,155,.34),transparent 44%)}
    .look:nth-child(2):before{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.72)),radial-gradient(circle at 50% 15%,rgba(167,123,255,.35),transparent 44%)}
    .look:nth-child(3):before{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.72)),radial-gradient(circle at 50% 15%,rgba(80,188,255,.34),transparent 44%)}
    .look:active{transform:scale(.97)}
    .look.selected{border-color:#ff67a4;box-shadow:0 0 0 4px rgba(255,77,152,.12),0 18px 42px rgba(255,77,152,.19)}
    .inner{position:relative;z-index:2;min-height:188px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .emoji{font-size:26px;margin-bottom:6px}
    .num{font-size:72px;line-height:.85;font-weight:1000;letter-spacing:-.09em;background:linear-gradient(135deg,#ff3286,#ff79ad 48%,#9867ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 7px 15px rgba(255,78,151,.15))}
    .pick{margin-top:12px;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:10px;font-weight:950;color:#8f7180}
    .hint{text-align:center;margin-top:15px;color:#8f7d86;font-size:11px;font-weight:750}
    .status{display:none;margin:13px auto 0;width:max-content;max-width:100%;padding:9px 13px;border-radius:999px;background:#fff0f6;border:1px solid #ffd1e3;color:#95425f;font-size:11px;font-weight:900}.status.show{display:block}
    footer{text-align:center;margin-top:18px;color:#b49fa9;font-size:9px}
    @media(max-width:360px){.look{min-height:170px}.inner{min-height:168px}.num{font-size:64px}.hero h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><div class="avatar">🎀</div><div class="handle">@keiradaily</div></div>

    <section class="hero">
      <h1>Kamu pilih yang mana? 👀</h1>
      <p>Tap satu nomor favoritmu. Pilihan langsung dikirim.</p>
    </section>

    <section class="looks" id="vote">
      <button class="look" type="button" data-choice="1" aria-label="Pilih nomor 1"><span class="inner"><span class="emoji">✨</span><span class="num">1</span><span class="pick">PILIH 1</span></span></button>
      <button class="look" type="button" data-choice="2" aria-label="Pilih nomor 2"><span class="inner"><span class="emoji">🎀</span><span class="num">2</span><span class="pick">PILIH 2</span></span></button>
      <button class="look" type="button" data-choice="3" aria-label="Pilih nomor 3"><span class="inner"><span class="emoji">💗</span><span class="num">3</span><span class="pick">PILIH 3</span></span></button>
    </section>

    <div class="hint">Cukup 1 tap — tidak perlu tombol kirim lagi.</div>
    <div class="status" id="status">Pilihan terkirim ✓</div>
    <footer>tari · gaya · harian</footer>
  </main>

  <script>
    const SMARTLINK='https://www.profitableratecpmnetwork.com/zier1utgei?key=c13a4c2591a765f2f52cb52775610c8a';
    const looks=[...document.querySelectorAll('.look')];
    const status=document.getElementById('status');
    let locked=false;

    function goSmartlink(choice){
      if(locked)return;
      locked=true;
      looks.forEach(x=>{x.disabled=true;x.classList.toggle('selected',x.dataset.choice===choice)});
      status.textContent=`Nomor ${choice} terkirim ✓`;
      status.classList.add('show');
      localStorage.setItem('keira-outfit-vote',choice);
      localStorage.setItem('keira-outfit-vote-time',new Date().toISOString());

      if(typeof gtag==='function'){
        gtag('event','vote_selected',{choice,event_category:'vote_funnel'});
        gtag('event','vote_submitted',{choice,event_category:'vote_funnel'});
      }

      let moved=false;
      const redirect=()=>{if(moved)return;moved=true;window.location.assign(SMARTLINK)};

      if(typeof gtag==='function'){
        gtag('event','smartlink_redirect',{
          choice,
          event_category:'vote_funnel',
          destination:'adsterra_smartlink',
          transport_type:'beacon',
          event_callback:redirect,
          event_timeout:450
        });
      }
      setTimeout(redirect,550);
    }

    looks.forEach(btn=>btn.addEventListener('click',()=>goSmartlink(btn.dataset.choice)));
  </script>
</body>
</html>
